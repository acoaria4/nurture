<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f5f2" />
    <link rel="icon" href="data:," />
    <title>Nurture Everyday | 3D Asset Preview</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="studio">
      <header class="studio-header">
        <div class="identity">
          <span class="wordmark">TRAYN <span>NUTRITION</span></span>
          <span class="divider" aria-hidden="true"></span>
          <h1>Nurture Everyday</h1>
        </div>
        <span class="status"><span aria-hidden="true"></span>Concept model</span>
      </header>

      <section class="viewport" aria-label="Interactive Nurture product model">
        <canvas id="model-canvas" aria-label="Nurture Everyday 3D tin" tabindex="0"></canvas>
        <div class="fallback" id="fallback" role="status">
          <img src="../assets/nurture-product-cutout-concept-v1.png" alt="Nurture Everyday concept tin" />
          <p id="loading-message">Preparing model</p>
        </div>
        <div class="view-label"><span id="view-name">FRONT</span><span>400g</span></div>
        <div class="toast" id="toast" role="status" hidden></div>
      </section>

      <footer class="toolbar">
        <div class="toolbar-group views" role="group" aria-label="Product angle">
          <button type="button" data-view="front" aria-pressed="true">Front</button>
          <button type="button" data-view="side" aria-pressed="false">Side</button>
          <button type="button" data-view="back" aria-pressed="false">Back</button>
          <button type="button" data-view="top" aria-pressed="false">Top</button>
        </div>
        <div class="toolbar-group actions">
          <button type="button" id="rotate" class="icon-button" aria-label="Start automatic rotation" title="Automatic rotation" aria-pressed="false"><i data-lucide="rotate-3d"></i></button>
          <button type="button" id="reset" class="icon-button" aria-label="Reset view" title="Reset view"><i data-lucide="rotate-ccw"></i></button>
          <span class="tool-divider" aria-hidden="true"></span>
          <button type="button" id="zoom-out" class="icon-button" aria-label="Zoom out" title="Zoom out"><i data-lucide="zoom-out"></i></button>
          <button type="button" id="zoom-in" class="icon-button" aria-label="Zoom in" title="Zoom in"><i data-lucide="zoom-in"></i></button>
        </div>
        <div class="toolbar-group settings">
          <label for="light">Light</label>
          <select id="light"><option value="studio">Studio</option><option value="daylight">Daylight</option><option value="soft">Soft</option></select>
          <button type="button" id="export" class="export-button" disabled><i data-lucide="download"></i><span>GLB</span></button>
          <button type="button" id="snapshot" class="icon-button" aria-label="Save current image" title="Save image" disabled><i data-lucide="camera"></i></button>
        </div>
      </footer>
      <p class="asset-note">Estimated dimensions. Generated label artwork. Side and back artwork pending.</p>
    </main>
    <script type="module" src="./preview.js"></script>
  </body>
</html>
