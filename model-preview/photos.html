<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f5f2" />
    <link rel="icon" href="data:," />
    <title>Nurture Everyday | Product Photos</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./gallery.css" />
  </head>
  <body>
    <header class="studio-header">
      <div class="identity"><span class="wordmark">TRAYN <span>NUTRITION</span></span><span class="divider" aria-hidden="true"></span><h1>Nurture Everyday</h1></div>
      <a class="model-link" href="./">3D Model <i data-lucide="arrow-up-right"></i></a>
    </header>
    <main class="photo-library">
      <div class="library-heading"><h2>Product Photos</h2><span class="status">Concept renders &middot; 1600 &times; 2000</span></div>
      <div id="photo-grid" class="photo-grid"></div>
      <p class="asset-note">Generated packaging concept. Product information and dimensions are provisional.</p>
    </main>
    <dialog id="photo-dialog" aria-labelledby="dialog-title">
      <div class="dialog-toolbar">
        <h2 id="dialog-title"></h2>
        <div class="dialog-actions">
          <a id="dialog-download" class="icon-button" download aria-label="Download photo" title="Download photo"><i data-lucide="download"></i></a>
          <button type="button" id="dialog-close" class="icon-button" aria-label="Close photo" title="Close"><i data-lucide="x"></i></button>
        </div>
      </div>
      <img id="dialog-image" alt="" />
    </dialog>
    <script type="module" src="./gallery.js"></script>
  </body>
</html>
